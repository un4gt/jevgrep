name: Reviewed release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing candidate after a separately authorized B acceptance
        type: boolean
        default: false
      candidate_run:
        description: Successful candidate workflow run (publish only, same main SHA)
        type: string
      b_acceptance:
        description: Reviewed B receipt JSON for the exact manifests (publish only; no credentials)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: jg-reviewed-release
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.ref == 'refs/heads/main' && !inputs.publish
    uses: ./.github/workflows/compatibility.yml
  build:
    needs: compatibility
    if: github.ref == 'refs/heads/main' && !inputs.publish
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-24.04, name: linux }
    runs-on: ${{ matrix.os }}
    env:
      EMRANK_ISSUER: ${{ vars.EMRANK_ISSUER }}
      EMRANK_APP_ID: ${{ vars.EMRANK_APP_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: bun install --frozen-lockfile
      - run: bun run prepare:upstream
      - name: Prepare only this target
        env:
          EMRANK_RELEASE_CREDENTIAL: ${{ secrets.EMRANK_RELEASE_CREDENTIAL }}
        run: python scripts/release/control.py prepare
      - name: Build the native candidate once
        run: bun run build --release
      - if: always()
        run: python scripts/release/control.py erase
      - run: bun run pack
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-${{ matrix.name }}
          path: artifacts/*.tgz
          if-no-files-found: error
  seal:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: build-*
          path: targets
      - name: Select identical shared contents and seal the actual four archives
        run: |
          python scripts/release/candidates.py seal --windows targets/build-windows --linux targets/build-linux --out sealed \
            --version "$(node -p "require('./native/package.json').version")" --overlay "$GITHUB_SHA" \
            --upstream "$(node -p "JSON.parse(require('fs').readFileSync('upstream.lock')).sha")" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sealed-native-candidate
          path: sealed/
          if-no-files-found: error
  install:
    needs: seal
    strategy:
      max-parallel: 2
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sealed-native-candidate, path: sealed }
      - run: python scripts/release/candidates.py install sealed installed
  verify:
    needs: install
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sealed-native-candidate, path: sealed }
      - run: python scripts/release/control.py verify
        env:
          EMRANK_ISSUER: ${{ vars.EMRANK_ISSUER }}
          EMRANK_APP_ID: ${{ vars.EMRANK_APP_ID }}
          EMRANK_RELEASE_CREDENTIAL: ${{ secrets.EMRANK_RELEASE_CREDENTIAL }}
  acceptance:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    environment: release
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      B_ACCEPTANCE: ${{ inputs.b_acceptance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python scripts/release/control.py check-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-native-candidate
          path: sealed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - run: python scripts/release/control.py gate
  publish_candidate:
    needs: acceptance
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      B_ACCEPTANCE: ${{ inputs.b_acceptance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-native-candidate
          path: sealed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: python scripts/release/control.py publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  registry:
    needs: publish_candidate
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      B_ACCEPTANCE: ${{ inputs.b_acceptance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-native-candidate
          path: sealed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - run: python scripts/release/control.py registry
  promote:
    needs: registry
    runs-on: ubuntu-24.04
    environment: release
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      B_ACCEPTANCE: ${{ inputs.b_acceptance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-native-candidate
          path: sealed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - run: python scripts/release/control.py promote
        env:
          EMRANK_ISSUER: ${{ vars.EMRANK_ISSUER }}
          EMRANK_APP_ID: ${{ vars.EMRANK_APP_ID }}
          EMRANK_RELEASE_CREDENTIAL: ${{ secrets.EMRANK_RELEASE_CREDENTIAL }}
  default_tag:
    needs: promote
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      B_ACCEPTANCE: ${{ inputs.b_acceptance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-native-candidate
          path: sealed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: python scripts/release/control.py tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
