name: Reviewed release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages after release environment approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/compatibility.yml
  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: compatibility-*
          path: verified
      - name: Publish the verified bytes, platform packages first
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release/publish.ts
