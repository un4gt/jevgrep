name: Compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: rustup default stable
      - name: Linux secure credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus-x11 gnome-keyring
      - name: Validate workflow syntax
        if: runner.os == 'Linux'
        run: |
          curl --fail --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: bun install --frozen-lockfile
      - name: Checkout pinned SHA and apply three-way patches
        run: bun run prepare:upstream
      - name: Windows upstream, OAuth and installed-package regression
        if: runner.os == 'Windows'
        run: bun run verify
      - name: Linux upstream, OAuth and installed-package regression
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/verify/linux.sh
      - name: Retain reports, packages and patch failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            reports/
            artifacts/
            .work/prepared.json
            .work/upstream/.git/rebase-apply/patch
            .work/upstream/.git/rebase-apply/msg
          include-hidden-files: true
          if-no-files-found: warn
